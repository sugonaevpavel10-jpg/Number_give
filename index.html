<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Номердай</title>
<style>
:root{--bg:#05060a;--text:#fff;--muted:#8892b0;--panel:rgba(22,25,35,.9);--border:rgba(255,255,255,.08);--rub:#34d399;--token:#60a5fa;--acc:#3b82f6;--com:#94a3b8;--rar:#10b981;--epi:#a855f7;--leg:#fbbf24;--myth:#ff0080;--topbg:#0a0c14}
body.t-white{--bg:#e2e8f0;--text:#0f172a;--muted:#475569;--panel:#f8fafc;--border:rgba(0,0,0,.1);--topbg:#fff;--rub:#059669;--token:#2563eb}
body.t-pink{--bg:#2d0a1f;--text:#fff;--muted:#f9a8d4;--panel:#3a0f28;--border:rgba(236,72,153,.2);--topbg:#2d0a1f}
body.t-gray{--bg:#1f2126;--text:#fff;--muted:#9ca3af;--panel:#2a2d34;--border:rgba(255,255,255,.1);--topbg:#1f2126}
body.t-blue{--bg:#051829;--text:#fff;--muted:#38bdf8;--panel:#0a2136;--border:rgba(56,189,248,.2);--topbg:#051829}
body.t-cyber{--bg:#170626;--text:#fff;--muted:#d8b4fe;--panel:#220a36;--border:rgba(168,85,247,.2);--topbg:#170626}
body.t-gold{--bg:#2a1c05;--text:#fff;--muted:#fde68a;--panel:#3a2808;--border:rgba(251,191,36,.2);--topbg:#2a1c05}
body.t-emerald{--bg:#051f14;--text:#fff;--muted:#6ee7b7;--panel:#0a2e1f;--border:rgba(16,185,129,.2);--topbg:#051f14}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.splash{position:fixed;inset:0;z-index:9999;background:#05060a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,transform .5s}
.splash.hide{opacity:0;transform:scale(1.1);pointer-events:none}
.splash-logo{font-size:52px;font-weight:900;letter-spacing:8px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6,#fbbf24,#60a5fa);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:hue 3s linear infinite}
@keyframes hue{to{background-position:300% 0}}
.splash-sub{font-size:12px;color:#8892b0;letter-spacing:6px;margin-top:12px;text-transform:uppercase}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg);overflow:hidden}
.bg::before{content:'';position:absolute;inset:-20%;filter:blur(70px);opacity:.4;background:radial-gradient(circle at 20% 20%,#3b82f6,transparent 40%),radial-gradient(circle at 80% 30%,#a855f7,transparent 40%),radial-gradient(circle at 40% 80%,#ec4899,transparent 40%)}
.app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--topbg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);gap:8px}
.back{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;padding-right:10px;display:none}
.title{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;background:linear-gradient(90deg,var(--text),var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.bal{display:flex;gap:8px}
.wal{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.06);padding:6px 10px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;gap:4px;white-space:nowrap}
.wal.rub{color:var(--rub);border-color:rgba(52,211,153,.3)}
.wal.token{color:var(--token);border-color:rgba(96,165,250,.3)}
.snd{background:var(--panel);border:1px solid var(--border);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--text)}
.view{display:none;flex:1;padding:20px}
.view.active{display:block;animation:sin .2s}
@keyframes sin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;position:relative}
.mc:active{transform:scale(.97)}
.ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.02));border:1px solid var(--border)}
.ml{font-size:15px;font-weight:800;text-align:center}
.md{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.gen{background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:30px;padding:20px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:340px;justify-content:center}
.gen[data-rarity="rare"]{border-color:var(--rar)}
.gen[data-rarity="epic"]{border-color:var(--epi);box-shadow:0 0 30px rgba(168,85,247,.3)}
.gen[data-rarity="legend"]{border-color:var(--leg);box-shadow:0 0 40px rgba(251,191,36,.4)}
.gen[data-rarity="mythic"]{border-color:var(--myth);box-shadow:0 0 50px rgba(255,0,128,.6)}
.showcase{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:15px;width:100%}
.img-wrap{width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:#131830;border-radius:20px;margin-bottom:10px}
.svg-box svg{width:100%;height:100%;object-fit:contain;padding:10px}
.car-brand{font-size:12px;font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:3px}
.car-title{font-size:25px;font-weight:900;text-transform:uppercase;text-align:center}
.badge{font-size:10px;font-weight:900;padding:4px 12px;border-radius:20px;text-transform:uppercase;margin-top:2px;display:none}
.bg-com{background:var(--com);color:#000}.bg-rar{background:var(--rar);color:#fff}.bg-epi{background:var(--epi);color:#fff}.bg-leg{background:var(--leg);color:#000}.bg-myt{background:linear-gradient(90deg,#ff0080,#8b5cf6,#06b6d4);color:#fff}
.price{font-size:30px;font-weight:900;color:var(--text);opacity:1;margin-top:10px}
.plate{display:inline-flex;background:#fbfbfb;border:2px solid #111;border-radius:6px;font-family:"Arial Narrow",Impact,sans-serif;overflow:hidden}
.plate-t{font-size:34px;font-weight:800;color:#0a0a0a;padding:4px 12px;display:flex;align-items:center;justify-content:center;min-width:170px}
.plate-s{border-left:2px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;background:#f0f0f0;min-width:48px}
.plate-r{font-size:20px;font-weight:800;color:#0a0a0a}
.plate-c{font-size:8px;font-weight:800;color:#0a0a0a}
.plate-f{width:14px;height:10px;display:flex;flex-direction:column;border:1px solid #000}
.fw{background:#fff;flex:1}.fb{background:#0039a6;flex:1}.fr{background:#d52b1e;flex:1}
.r-com{border-color:#333}.r-rar{border-color:var(--rar)}.r-epi{border-color:var(--epi)}.r-leg{border-color:var(--leg)}.r-myt{border-color:var(--myth)}
.btns{display:flex;gap:10px;width:100%;margin-top:15px}
.btn{padding:16px;border-radius:14px;border:none;font-size:13px;font-weight:900;cursor:pointer;display:flex;justify-content:center;align-items:center;flex:1;text-transform:uppercase;color:var(--text)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:linear-gradient(135deg,#4f8cff,#2f5bea);color:#fff}
.btn-s{background:rgba(52,211,153,.12);color:var(--rub);border:1px solid rgba(52,211,153,.4)}
.btn-v{background:rgba(96,165,250,.12);color:var(--token);border:1px solid rgba(96,165,250,.4)}
.btn-d{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.4)}
.btn-pr{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.btn.btn-roll,.btn.btn-roll-b{flex-direction:column;gap:3px;padding:14px 10px;border-radius:18px}
.btn.btn-roll{background:linear-gradient(135deg,#4f8cff,#2f5bea);color:#fff}
.btn.btn-roll-b{background:linear-gradient(135deg,rgba(251,191,36,.28),rgba(245,158,11,.1));color:#fde68a;border:1px solid rgba(251,191,36,.65)}
.btn.btn-roll-p{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#fff}
.btn-x10{width:100%;margin-top:10px;padding:14px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border-radius:16px;border:none;font-size:13px;font-weight:900;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--panel);padding:5px;border-radius:16px;border:1px solid var(--border)}
.tab{flex:1;padding:12px;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:13px;border-radius:10px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,rgba(79,140,255,.35),rgba(139,92,246,.3));color:var(--text)}
.list{display:flex;flex-direction:column;gap:10px}
.li{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.li-svg{width:70px;height:48px;margin-right:12px;background:#131830;border-radius:8px;padding:5px;display:flex;align-items:center;justify-content:center}
.li-svg svg{width:100%;height:100%}
.li-title{font-size:15px;font-weight:800}
.li-brand{font-size:10px;color:var(--acc);font-weight:800;text-transform:uppercase}
.li-price{font-size:15px;font-weight:900;text-align:right}
.li-price.rub{color:var(--rub)}.li-price.token{color:var(--token)}
.sell-b{background:none;border:none;color:#ef4444;font-size:11px;font-weight:900;cursor:pointer;margin-top:4px;text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;border:2px dashed var(--border);border-radius:20px}
.lb{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);padding:10px;border-radius:12px;margin-bottom:8px}
.lb-rank{font-weight:900;color:var(--muted);width:20px;text-align:center}
.lb-name{flex:1;font-size:13px;font-weight:800}
.lb-val{font-size:13px;font-weight:900;color:var(--rub)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-ov.active{opacity:1;pointer-events:all}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:28px;padding:32px 24px;width:90%;max-width:340px;text-align:center}
.m-ico{font-size:60px;margin-bottom:16px}
.m-title{font-size:22px;font-weight:900;margin-bottom:8px}
.m-text{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rub);color:#000;padding:12px 22px;border-radius:999px;font-weight:900;font-size:13px;z-index:9999}
</style>
</head>
<body class="t-black">

<div class="splash" id="splash">
    <div class="splash-logo">НОМЕРДАЙ</div>
    <div class="splash-sub" id="splashSub">загрузка</div>
</div>

<div class="bg"></div>

<div class="app">
    <div class="top">
        <div style="display:flex;align-items:center;">
            <button class="back" id="backBtn" onclick="navigate('menu')">←</button>
            <div class="title" id="pageTitle">Номердай</div>
        </div>
        <div class="bal">
            <div class="wal rub"><span id="uiRub">0</span> ₽</div>
            <div class="wal token">💎 <span id="uiTok">0</span></div>
            <button class="snd" id="sndBtn" onclick="toggleSound()">🔊</button>
        </div>
    </div>

    <div class="view active" id="v-menu">
        <div class="menu-grid">
            <div class="mc" onclick="navigate('cars')"><div class="ico">🚗</div><div class="ml">Автосалон</div><div class="md">Крутить тачки</div></div>
            <div class="mc" onclick="navigate('plates')"><div class="ico">🔢</div><div class="ml">Госзнаки</div><div class="md">Крутить номера</div></div>
            <div class="mc" onclick="navigate('garage')"><div class="ico">🏎️</div><div class="ml">Гараж</div><div class="md" id="menuGarage">0 | 0</div></div>
            <div class="mc" onclick="navigate('leaderboard')"><div class="ico">📊</div><div class="ml">Топ игроков</div><div class="md">Онлайн</div></div>
            <div class="mc" onclick="navigate('profile')"><div class="ico">👑</div><div class="ml">Профиль</div><div class="md">Настройки</div></div>
        </div>
    </div>

    <div class="view" id="v-cars">
        <div class="gen" id="genCarBox" data-rarity="common">
            <div class="showcase">
                <div class="img-wrap"><div class="svg-box" id="carSvgBox"></div></div>
                <div class="car-brand" id="carBrand">ВАЗ</div>
                <div class="car-title" id="carName">2107</div>
                <div class="badge" id="carBadge">Common</div>
            </div>
            <div class="price" id="carPrice">0 ₽</div>
        </div>
        <div class="btns" id="actCarStart">
            <button class="btn btn-roll" onclick="rollCar(false)">Крутить<br><small>2 000 000 ₽</small></button>
            <button class="btn btn-roll-b" onclick="rollCar(true)">Boost<br><small>6 000 000 ₽</small></button>
        </div>
        <div class="btns" id="actCarRes" style="display:none;">
            <button class="btn btn-s" onclick="sellCurrentCar()">Продать</button>
            <button class="btn btn-v" onclick="saveCurrentCar()">В гараж</button>
        </div>
    </div>

    <div class="view" id="v-plates">
        <div class="gen" id="genPlateBox" data-rarity="common">
            <div class="plate" id="standalonePlate">
                <div class="plate-t" id="plateText">А 000 АА</div>
                <div class="plate-s">
                    <div class="plate-r" id="plateRegion">77</div>
                    <div class="plate-c">RUS</div>
                    <div class="plate-f"><div class="fw"></div><div class="fb"></div><div class="fr"></div></div>
                </div>
            </div>
            <div class="price" id="platePrice">0 💎</div>
        </div>
        <div class="btns" id="actPlateStart">
            <button class="btn btn-roll-p" onclick="rollPlate(false)">Крутить<br><small>500 💎</small></button>
            <button class="btn btn-roll-b" onclick="rollPlate(true)">Boost<br><small>1 500 💎</small></button>
        </div>
        <div class="btns" id="actPlateRes" style="display:none;">
            <button class="btn btn-s" onclick="sellCurrentPlate()">Продать</button>
            <button class="btn btn-v" onclick="saveCurrentPlate()">В гараж</button>
        </div>
    </div>

    <div class="view" id="v-garage">
        <div class="tabs">
            <button class="tab active" onclick="switchGarageTab('cars')">🚗 Машины</button>
            <button class="tab" onclick="switchGarageTab('plates')">🔢 Номера</button>
        </div>
        <div class="list" id="garageList"></div>
    </div>

    <div class="view" id="v-leaderboard">
        <h2 style="text-align:center;margin-bottom:20px;">Топ игроков</h2>
        <div id="lbList"></div>
    </div>

    <div class="view" id="v-profile">
        <h2 style="text-align:center;margin-bottom:20px;">Профиль</h2>
        <div class="li"><div>Баланс</div><div id="profRub" style="font-weight:900;color:var(--rub)">0 ₽</div></div>
        <div class="li"><div>Жетоны</div><div id="profTok" style="font-weight:900;color:var(--token)">0 💎</div></div>
        <div class="btns">
            <button class="btn btn-d" onclick="resetGame()">Сбросить</button>
        </div>
    </div>
</div>

<div class="modal-ov" id="modal"><div class="modal"><div class="m-ico" id="mIcon">🎉</div><div class="m-title" id="mTitle">Ошибка</div><div class="m-text" id="mText"></div><button class="btn btn-p" onclick="closeModal()">ОК</button></div></div>

<script>
// ================= БАЗА ДАННЫХ КОНФИГА =================
const SVG = {
    hatch:'<svg viewBox="0 0 200 100"><path d="M30 70 L40 50 L80 30 L140 30 L170 50 L185 60 L185 75 L30 75 Z" fill="#cbd5e1"/><circle cx="60" cy="75" r="15" fill="#1e293b"/><circle cx="150" cy="75" r="15" fill="#1e293b"/></svg>',
    sedan:'<svg viewBox="0 0 200 100"><path d="M20 70 L30 45 L70 25 L140 25 L175 45 L190 60 L190 75 L20 75 Z" fill="#60a5fa"/><circle cx="50" cy="75" r="16" fill="#0f172a"/><circle cx="150" cy="75" r="16" fill="#0f172a"/></svg>',
    suv:'<svg viewBox="0 0 200 100"><path d="M15 75 L25 40 L60 20 L150 20 L180 40 L195 55 L195 75 Z" fill="#f87171"/><circle cx="50" cy="75" r="18" fill="#0f172a"/><circle cx="155" cy="75" r="18" fill="#0f172a"/></svg>',
    sport:'<svg viewBox="0 0 200 100"><path d="M10 75 L30 50 L80 35 L140 35 L180 55 L195 65 L195 75 Z" fill="#fbbf24"/><circle cx="55" cy="75" r="15" fill="#0f172a"/><circle cx="150" cy="75" r="15" fill="#0f172a"/></svg>'
};

const CARS = {
    common: [
        {brand:'LADA',name:'Granta',svg:SVG.hatch,price:1200000},
        {brand:'KIA',name:'Rio',svg:SVG.hatch,price:1800000}
    ],
    rare: [
        {brand:'TOYOTA',name:'Camry',svg:SVG.sedan,price:4500000},
        {brand:'KIA',name:'K5',svg:SVG.sedan,price:4000000}
    ],
    epic: [
        {brand:'BMW',name:'5 Series',svg:SVG.sport,price:9000000}
    ],
    legend: [
        {brand:'BUGATTI',name:'Chiron',svg:SVG.sport,price:150000000}
    ]
};

// ================= СОСТОЯНИЕ =================
let state = {
    rub: 5000000, tok: 10000,
    currentCar: null, currentPlate: null,
    garageCars: [], garagePlates: [],
    autoCom: false, autoRar: false,
    soundOn: true
};

// ================= ЯДРО =================
function formatMoney(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function updateUI() {
    document.getElementById('uiRub').textContent = formatMoney(state.rub);
    document.getElementById('uiTok').textContent = formatMoney(state.tok);
    document.getElementById('menuGarage').textContent = `${state.garageCars.length} | ${state.garagePlates.length}`;
    document.getElementById('profRub').textContent = formatMoney(state.rub) + ' ₽';
    document.getElementById('profTok').textContent = formatMoney(state.tok) + ' 💎';
    saveState();
}

function saveState() {
    localStorage.setItem('nomerday_save', JSON.stringify(state));
}

function loadState() {
    const s = localStorage.getItem('nomerday_save');
    if (s) {
        try {
            const p = JSON.parse(s);
            state = { ...state, ...p };
        } catch(e){}
    }
}

function navigate(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('v-' + id).classList.add('active');
    document.getElementById('backBtn').style.display = id === 'menu' ? 'none' : 'block';
    if (id === 'garage') renderGarage();
    if (id === 'cars') resetCarUI();
    if (id === 'plates') resetPlateUI();
    if (id === 'leaderboard') renderLeaderboard();
    updateUI();
}

// ================= МАШИНЫ =================
function rollCar(boosted) {
    const cost = boosted ? 6000000 : 2000000;
    if (state.rub < cost) return showModal('Мало денег', 'Нужно больше рублей');

    // Списываем
    state.rub -= cost;

    // Генерируем
    let rarity = 'common';
    const rnd = Math.random();
    if (rnd < 0.01) rarity = 'legend';
    else if (rnd < 0.10) rarity = 'epic';
    else if (rnd < 0.30) rarity = 'rare';

    const pool = CARS[rarity];
    const car = { ...pool[Math.floor(Math.random() * pool.length)], rarity };

    // Показываем
    state.currentCar = car;
    showCarResult(car);
    updateUI();
}

function showCarResult(car) {
    document.getElementById('carSvgBox').innerHTML = car.svg;
    document.getElementById('carBrand').textContent = car.brand;
    document.getElementById('carName').textContent = car.name;
    document.getElementById('carPrice').textContent = formatMoney(car.price) + ' ₽';
    document.getElementById('carBadge').textContent = car.rarity;
    document.getElementById('carBadge').style.display = 'inline-block';
    document.getElementById('actCarStart').style.display = 'none';
    document.getElementById('actCarRes').style.display = 'flex';
}

function sellCurrentCar() {
    if (!state.currentCar) return;
    state.rub += state.currentCar.price;
    state.currentCar = null;
    resetCarUI();
    updateUI();
}

function saveCurrentCar() {
    if (!state.currentCar) return;
    state.garageCars.push(state.currentCar);
    state.currentCar = null;
    resetCarUI();
    updateUI();
}

function resetCarUI() {
    document.getElementById('actCarStart').style.display = 'flex';
    document.getElementById('actCarRes').style.display = 'none';
    document.getElementById('carSvgBox').innerHTML = CARS.common[0].svg;
    document.getElementById('carBrand').textContent = CARS.common[0].brand;
    document.getElementById('carName').textContent = CARS.common[0].name;
    document.getElementById('carPrice').textContent = '0 ₽';
    document.getElementById('carBadge').style.display = 'none';
}

// ================= НОМЕРА =================
function rollPlate(boosted) {
    const cost = boosted ? 1500 : 500;
    if (state.tok < cost) return showModal('Мало жетонов', 'Нужно больше 💎');

    state.tok -= cost;

    const letters = ['А','В','Е','К','М','Н','О','Р','С','Т','У','Х'];
    const l1 = letters[Math.floor(Math.random()*letters.length)];
    const l2 = letters[Math.floor(Math.random()*letters.length)] + letters[Math.floor(Math.random()*letters.length)];
    const num = Math.floor(Math.random()*999).toString().padStart(3,'0');
    const region = '77';
    const price = 5000 + Math.floor(Math.random()*20000);

    const plate = { l1, l2, num, region, price, rarity: 'rare' };
    
    state.currentPlate = plate;
    showPlateResult(plate);
    updateUI();
}

function showPlateResult(p) {
    document.getElementById('plateText').textContent = `${p.l1} ${p.num} ${p.l2}`;
    document.getElementById('plateRegion').textContent = p.region;
    document.getElementById('platePrice').textContent = formatMoney(p.price) + ' 💎';
    document.getElementById('actPlateStart').style.display = 'none';
    document.getElementById('actPlateRes').style.display = 'flex';
}

function sellCurrentPlate() {
    if (!state.currentPlate) return;
    state.tok += state.currentPlate.price;
    state.currentPlate = null;
    resetPlateUI();
    updateUI();
}

function saveCurrentPlate() {
    if (!state.currentPlate) return;
    state.garagePlates.push(state.currentPlate);
    state.currentPlate = null;
    resetPlateUI();
    updateUI();
}

function resetPlateUI() {
    document.getElementById('actPlateStart').style.display = 'flex';
    document.getElementById('actPlateRes').style.display = 'none';
    document.getElementById('plateText').textContent = 'А 000 АА';
    document.getElementById('plateRegion').textContent = '77';
    document.getElementById('platePrice').textContent = '0 💎';
}

// ================= ГАРАЖ =================
let garageTab = 'cars';
function switchGarageTab(t) {
    garageTab = t;
    renderGarage();
}

function renderGarage() {
    const list = document.getElementById('garageList');
    list.innerHTML = '';
    if (garageTab === 'cars') {
        if (!state.garageCars.length) { list.innerHTML = '<div class="empty">Пусто</div>'; return; }
        state.garageCars.forEach((c, i) => {
            list.innerHTML += `<div class="li"><div style="display:flex"><div class="li-svg">${c.svg}</div><div><div class="li-brand">${c.brand}</div><div class="li-title">${c.name}</div></div></div><div><div class="li-price rub">${formatMoney(c.price)} ₽</div><button class="sell-b" onclick="sellGarageCar(${i})">Продать</button></div></div>`;
        });
    } else {
        if (!state.garagePlates.length) { list.innerHTML = '<div class="empty">Пусто</div>'; return; }
        state.garagePlates.forEach((p, i) => {
            list.innerHTML += `<div class="li"><div><div class="li-title">${p.l1} ${p.num} ${p.l2}</div><div class="li-brand">${p.region} рег.</div></div><div><div class="li-price token">${formatMoney(p.price)} 💎</div><button class="sell-b" onclick="sellGaragePlate(${i})">Продать</button></div></div>`;
        });
    }
}

function sellGarageCar(i) {
    state.rub += state.garageCars[i].price;
    state.garageCars.splice(i, 1);
    renderGarage();
    updateUI();
}

function sellGaragePlate(i) {
    state.tok += state.garagePlates[i].price;
    state.garagePlates.splice(i, 1);
    renderGarage();
    updateUI();
}

// ================= ТОП =================
function renderLeaderboard() {
    const list = document.getElementById('lbList');
    list.innerHTML = '<div class="lb"><div class="lb-rank">1</div><div class="lb-name">Ты</div><div class="lb-val">' + formatMoney(state.rub) + ' ₽</div></div>';
}

// ================= ПРОЧЕЕ =================
function showModal(title, text) {
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mText').innerHTML = text;
    document.getElementById('modal').classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

function toggleSound() {
    state.soundOn = !state.soundOn;
    document.getElementById('sndBtn').textContent = state.soundOn ? '🔊' : '🔇';
}

function resetGame() {
    if (confirm('Сбросить прогресс?')) {
        localStorage.removeItem('nomerday_save');
        location.reload();
    }
}

// ================= СТАРТ =================
loadState();
updateUI();
resetCarUI();
resetPlateUI();

setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
}, 1500);

</script>
</body>
